<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-WorkPermit</title>
<style>
body {
  margin: 0;
  padding: 20px 12px;
  background: #e8edf2;
  font-family: Arial, sans-serif;
}
.paper {
  max-width: 400px;
  margin: auto;
  padding: 22px;
  background: white;
  border: 1px solid #bbb;
  border-radius: 8px;
}
.warning {
  padding: 10px;
  text-align: center;
  color: #8a3500;
  background: #fff0d5;
  border: 1px solid #e8bd75;
  font-weight: bold;
  font-size: 12px;
}
h2 { text-align: center; font-size: 21px; }
.profile { text-align: center; margin: 20px 0; }
.person {
  width: 100px;
  height: 120px;
  margin: auto;
  background: #e8edf2;
  border: 1px solid #aaa;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #555;
}
.head {
  width: 35px;
  height: 35px;
  background: #9da8b3;
  border-radius: 50%;
}
.bodyshape {
  width: 65px;
  height: 42px;
  background: #9da8b3;
  border-radius: 35px 35px 5px 5px;
  margin-top: 5px;
}
.field {
  padding: 12px 0;
  border-bottom: 1px solid #ddd;
}
.label { font-size: 12px; color: #666; }
.value { margin-top: 5px; font-size: 16px; font-weight: bold; }
.footer { text-align: center; color: #666; font-size: 11px; margin-top: 18px; }
</style>
</head>
<body>
<div class="paper">
  <div class="warning">SAMPLE  NOT AN OFFICIAL DOCUMENT</div>
  <h2>e-WorkPermit</h2>
  <div class="profile">
    <div class="person">
      <div class="head"></div>
      <div class="bodyshape"></div>
    </div>
    <p>Sample Profile Photo</p>
  </div>
  <div class="field">
    <div class="label">Document ID</div>
    <div class="value">DEMO-001</div>
  </div>
  <div class="field">
    <div class="label">Status</div>
    <div class="value">Sample document</div>
  </div>
  <div class="field">
    <div class="label">Verification</div>
    <div class="value">Demonstration only</div>
  </div>
  <div class="footer">
    This is a demo webpage, not an official permit.
  </div>
</div>
</body>
</html>
