
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e-WorkPermit Record</title>
<style>
<script>
window.addEventListener("DOMContentLoaded", function () {
  const params = new URLSearchParams(window.location.search);
  const recordId = params.get("id") || "DEMO-0001";
  const values = document.querySelectorAll(".value");

  if (values.length > 1) {
    values[1].textContent = recordId;
  }
});
</script>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #edf2f7;
  color: #1e293b;
}
header {
  background: #123b68;
  color: white;
  text-align: center;
  padding: 24px 12px;
}
main {
  max-width: 440px;
  margin: 24px auto;
  padding: 22px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 15px #0001;
}
h2 { color: #123b68; }
.field {
  padding: 13px 0;
  border-bottom: 1px solid #e2e8f0;
}
.label { color: #64748b; font-size: 13px; }
.value { margin-top: 5px; font-weight: bold; }
.status {
  display: inline-block;
  background: #fef3c7;
  color: #92400e;
  padding: 7px 12px;
  border-radius: 20px;
}
.note {
  margin-top: 20px;
  padding: 12px;
  background: #f1f5f9;
  font-size: 13px;
  border-radius: 8px;
}
footer {
  text-align: center;
  color: #64748b;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>
<body>
<header>
  <h1>e-WorkPermit</h1>
  <p>Digital Record System</p>
</header>
<main>
  <h2>Personal Record</h2>
  <div class="field">
    <div class="label">Full Name</div>
    <div class="value">Demo User</div>
  </div>
  <div class="field">
    <div class="label">Record ID</div>
    <div class="value">DEMO-0001</div><div class="value" id="recordId">DEMO-0001</div>
  </div>
  <div class="field">
    <div class="label">Document Type</div>
    <div class="value">Work Permit Record</div>
  </div>
  <div class="field">
    <div class="label">Status</div>
    <div class="value">
      <span class="status">Demo  Not Verified</span>
    </div>
  </div>
  <div class="note">
  This system official documents.
  </div>
</main>
<footer>e-WorkPermit  Demo System</footer>
</body>
</html>
